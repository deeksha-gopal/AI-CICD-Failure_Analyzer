services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/analysis.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - analyzer_data:/app/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
volumes:
  analyzer_data:
